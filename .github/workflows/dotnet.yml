name: GitPlayground Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: |
        dotnet test --no-build --configuration Release --logger "trx;LogFileName=test_results.trx" --results-directory ./test-results

    - name: Publish
      run: dotnet publish --no-build --configuration Release -o ./publish

    - name: Azure Login
      if: github.ref == 'refs/heads/main'
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy Bicep template
      run: |
        az group create --name GitPlayground --location canadaeast
        az deployment group create \
          --resource-group GitPlayground \
          --template-file infra/GitPlayground.bicep \
          --parameters location=canadaeast

    - name: Ensure zip is installed
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update && sudo apt-get install -y zip

    - name: Create ZIP of published output
      run: |
        cd ./publish
        zip -r ../app.zip .

    - name: Deploy published zip to Web App
      run: |
        echo "Deploying app.zip to web app: gitplayground in resource group: GitPlayground"
        az webapp deploy --resource-group GitPlayground --name gitplayground --src-path ./app.zip